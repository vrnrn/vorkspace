[workspace]
resolver = "2"
members = ["crates/vorkspace-core", "crates/vorkspace-gpui"]
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-apple"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

# Exclude the unused screen-capture dependency.
# Keep the Apple renderer's alpha and font-matching fixes.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }

# QuickJS deadlines assume the shipped interpreter. An unoptimized one is about
# five times slower, so it fails work that a release build finishes in budget.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = false

[profile.native-dev.package."*"]
opt-level = 1

[profile.native-dev.package.vorkspace-gpui]
opt-level = 1
