[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-macos"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

# Exclude the unused screen-capture dependency.
# Keep the Apple renderer's alpha and font-matching fixes.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# QuickJS deadlines assume the shipped interpreter. An unoptimized one is about
# five times slower, so it fails work that a release build finishes in budget.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = true

[profile.native-dev.package."*"]
opt-level = 1

[profile.native-dev.package.vorkspace-gpui]
opt-level = 1

[profile.native-dev.package.vorkspace-ui]
opt-level = 1

[profile.native-dev.package.vorkspace-model]
opt-level = 1

[profile.native-dev.package.vorkspace-macos]
opt-level = 1

[profile.native-dev.package.vorkspace-editor]
opt-level = 1

[profile.native-dev.package.vorkspace-runtime]
opt-level = 1

# Release code generation for scripts/benchmarks/benchmark-native.mjs, built apart
# from the shipped profile so a benchmark never replaces its artifacts.
[profile.perf]
inherits = "release"
