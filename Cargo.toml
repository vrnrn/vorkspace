[workspace]
resolver = "2"
members = ["crates/vorkspace-core", "crates/vorkspace-gpui"]
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-apple", "vendor/gpui-pre-linux", "vendor/gpui-pre-windows"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

# Exclude the unused screen-capture dependency from all native platforms.
# Keep the Apple renderer's alpha and font-matching fixes.
# The app owns its macOS notifications; omit the unused Linux notification bridge.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = false

[profile.native-dev.package."*"]
opt-level = 1

[profile.native-dev.package.vorkspace-gpui]
opt-level = 1
