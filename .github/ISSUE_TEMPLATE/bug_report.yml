name: Bug report
description: Report a problem in vorkspace
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        vorkspace runs on macOS. Remote hosts can run on macOS or Linux.

  - type: input
    id: version
    attributes:
      label: vorkspace version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.5, Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider CLI
      options:
        - Claude Code
        - Codex
        - Pi
        - omp
        - Multiple / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
