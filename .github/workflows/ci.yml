name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: npm ci
      - run: npm run assets
      - name: Verify generated assets
        run: git diff --exit-code -- crates/*/assets/
      - run: npm run check
        env:
          NEXTEST_PROFILE: ci
      - run: cargo build --locked -p vorkspace-gpui --profile native-dev
      - name: Package and verify native app signature
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          bash scripts/desktop/bundle-native-macos.sh native-dev target "$version" dev-data
      - run: npm run host:package
