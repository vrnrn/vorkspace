name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up pinned native compilers
        run: bash scripts/desktop/setup-ci-macos.sh
      - uses: Swatinem/rust-cache@v2
        env:
          # Concurrency does not change artifacts; omit it from the cache key.
          CARGO_BUILD_JOBS: ''
        with:
          shared-key: native-macos-26
          env-vars: VORKSPACE_BUILD_SDK
          cache-bin: false
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: npm ci
      - run: npm run assets
      - name: Verify generated assets
        run: git diff --exit-code -- crates/*/assets/
      - run: npm run check
        env:
          NEXTEST_PROFILE: ci
      - run: cargo build --locked -p vorkspace-gpui -p vorkspace-helper --profile verify
      - name: Package and verify native app signature
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          bash scripts/desktop/bundle-native-macos.sh verify target "$version" dev-data
      - run: npm run host:package
