name: Mac release

on:
  workflow_dispatch:
  push:
    tags:
      - "mac-v*"

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'vrnrn/vorkspace'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Prepare release version and build number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-macos-release.mjs

      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run check:web
      # Keep remote setup available for Apple Silicon and Intel Macs.
      - run: npm run test:host
      - name: Package Mac remote hosts
        run: |
          node host/package.mjs --target darwin-arm64
          node host/package.mjs --target darwin-x64

      # Apple ad hoc signing is separate from the mandatory updater signature.
      # This personal build does not require an Apple Developer certificate.
      - name: Build Apple Silicon app and upload draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MACOS_UPDATER_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: "-"
          RUSTFLAGS: "-D warnings"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "vorkspace __VERSION__"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload Mac host packages and migration helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            build/host-packages/vorkspace-host-darwin-{arm64,x64}.tar.gz \
            build/host-packages/vorkspace-host-darwin-{arm64,x64}.tar.gz.sha256 \
            scripts/migrate-monocode-to-vorkspace.sh LICENSE

      - name: Verify app and updater feed before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/vorkspace.app"
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/vorkspace")" = arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$RELEASE_VERSION"
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$RELEASE_BUILD_NUMBER"
          test ! -e "$APP/Contents/Resources/Assets.car"
          if plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist" >/dev/null 2>&1; then
            echo "App must use the original ICNS without a catalog override." >&2
            exit 1
          fi
          cmp src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/feed"
          gh release view "$RELEASE_TAG" --json name,assets,body > "$RUNNER_TEMP/assets.json"
          node scripts/verify-macos-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/feed/latest.json" "$RUNNER_TEMP/assets.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$RUNNER_TEMP/macos-release-notes.md"
