[package]
name = "vorkspace-connector-plugins"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
vorkspace-core = { path = "../vorkspace-core" }
vorkspace-plugin = { path = "../vorkspace-plugin" }

[[bin]]
name = "vorkspace-github-plugin"
path = "src/bin/github.rs"
[[bin]]
name = "vorkspace-gitlab-plugin"
path = "src/bin/gitlab.rs"
[[bin]]
name = "vorkspace-jira-plugin"
path = "src/bin/jira.rs"

[dev-dependencies]
tempfile = "3"
