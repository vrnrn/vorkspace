[package]
name = "vorkspace-ui"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
test-support = ["gpui/test-support"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
vorkspace-core = { path = "../vorkspace-core" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "block2", "NSEvent", "NSApplication", "NSDockTile", "NSButton", "NSControl", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSView", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSBezierPath", "NSColor", "NSFont", "NSFontDescriptor", "NSImageView", "NSTextField", "NSPasteboard", "NSScreen", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSGeometry", "NSData", "NSRange", "NSArray", "NSSet", "NSError", "NSBundle", "NSURL", "NSURLRequest"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }
