<style>
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font:
    13px -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  color: var(--foreground);
  background: var(--background);
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: default;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  padding: 6px 10px;
  min-height: 28px;
}
button:hover:enabled {
  filter: brightness(1.12);
}
button:disabled {
  opacity: .45;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
::selection {
  background: color-mix(in srgb, var(--accent) 30%, transparent);
}
input,
textarea,
select {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 9px;
  caret-color: var(--accent);
}
input::placeholder,
textarea::placeholder {
  color: var(--muted);
}
input,
textarea {
  min-width: 0;
}
textarea {
  resize: none;
  line-height: 1.65;
}
#app {
  display: flex;
  height: 100%;
}
aside {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}
.search {
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
}
.search-icon,
.search-icon svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.search input {
  flex: 1;
  height: 28px;
  border: 0;
  border-radius: 4px;
  padding: 0;
  color: var(--foreground);
  font-size: 14px;
}
aside svg path,
#delete-meeting svg path {
  stroke: currentColor;
}
#list {
  overflow: auto;
  flex: 1;
  padding: 6px;
}
#list button {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 2px;
  line-height: 1.45;
}
#list button:hover {
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
}
#list button[aria-current=true] {
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}
.list-title {
  max-width: 100%;
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-date {
  order: -1;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list-empty {
  padding: 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 19px;
}
.recording-controls {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}
.record {
  display: flex;
  align-items: center;
  gap: 7px;
}
.record svg {
  width: 12px;
  height: 12px;
  fill: #e75a63;
}
main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
#empty {
  margin: auto;
  max-width: 350px;
  text-align: center;
  padding: 32px;
  color: var(--muted);
  line-height: 1.65;
}
#empty h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--foreground);
  margin: 0 0 8px;
}
#document {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 20px;
  width: min(100%, 1024px);
  margin-inline: auto;
  padding: 32px;
  overflow-y: auto;
}
.document-header {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#title {
  width: 100%;
  border: 0;
  padding: 0;
  font-size: 20px;
  font-weight: 600;
}
.metadata {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.6;
}
.document-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  min-height: 28px;
  font-size: 12px;
}
.document-actions button {
  font-weight: 500;
}
#summarize:enabled {
  background: var(--foreground);
  color: var(--background);
  border-color: transparent;
}
#delete-meeting,
#cancel-delete {
  background: transparent;
  border-color: transparent;
}
#delete-meeting {
  color: light-dark(#b42338, #f87171);
}
#delete-meeting .delete-icon,
#delete-meeting svg {
  display: inline-block;
  vertical-align: -2px;
  width: 14px;
  height: 14px;
}
#delete-meeting .delete-icon {
  margin-right: 5px;
}
#delete-meeting:hover:enabled,
#cancel-delete:hover {
  background: color-mix(in srgb, var(--foreground) 8%, transparent);
}
.document-tabs {
  display: flex;
  flex-shrink: 0;
  align-items: stretch;
  gap: 16px;
  min-height: 36px;
  border-bottom: 1px solid var(--border);
}
.document-tabs button {
  border: 0;
  border-radius: 0;
  border-bottom: 2px solid transparent;
  padding: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.document-tabs button[aria-pressed=true] {
  color: var(--foreground);
  border-bottom-color: var(--foreground);
}
#mode-edit {
  background: transparent;
}
#save {
  display: none;
}
.editor-area {
  flex: 1;
  min-height: 160px;
  display: flex;
}
#editor {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 4px;
  padding: 6px 8px;
  font: 13px / 20px ui-monospace, Menlo, monospace;
  outline-offset: 4px;
}
#preview {
  display: none;
  width: 100%;
  font-size: 14px;
  line-height: 1.7;
  padding: 0 0 24px;
}
#preview h1,
#preview h2,
#preview h3 {
  font-size: 17px;
  line-height: 1.4;
  margin: 24px 0 8px;
  font-weight: 600;
}
#preview h1:first-child,
#preview h2:first-child {
  margin-top: 4px;
}
#preview p {
  margin: 8px 0 14px;
}
#preview li {
  margin: 5px 0;
}
#preview a {
  color: var(--link);
  text-underline-offset: 3px;
}
#preview pre {
  overflow: auto;
  padding: 12px;
  background: var(--surface);
  border-radius: 6px;
}
#preview table {
  border-collapse: collapse;
}
#preview td,
#preview th {
  padding: 7px 10px;
  border: 1px solid var(--border);
  text-align: left;
}
#live {
  display: none;
  overflow: auto;
  width: 100%;
  font-size: 14px;
  line-height: 1.65;
  padding: 0 0 24px;
}
#live p {
  margin: 0 0 17px;
  max-width: 72ch;
  white-space: pre-wrap;
}
.live-label {
  color: var(--muted);
  font-size: 11px;
  display: block;
  margin-bottom: 3px;
  font-variant-numeric: tabular-nums;
}
#partials {
  color: var(--muted);
  white-space: pre-wrap;
  max-width: 72ch;
}
.notice {
  display: none;
  width: min(calc(100% - 64px), 960px);
  margin: 10px auto 0;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  line-height: 1.5;
  font-size: 12px;
}
.notice.error {
  color: light-dark(#b42338, #f08a95);
}
.back {
  display: none;
}
#analysis-state {
  font-size: 11px;
  color: var(--muted);
}
@media (max-width: 800px) {
  aside {
    width: 224px;
  }
  #document {
    padding: 24px;
  }
  .notice {
    width: calc(100% - 48px);
  }
}
@media (max-width: 620px) {
  aside {
    width: 100%;
  }
  body.has-document aside {
    display: none;
  }
  body:not(.has-document) main {
    display: none;
  }
  .back {
    display: inline-block;
    align-self: flex-start;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button {
    transition: background-color 120ms ease-out, opacity 120ms ease-out;
  }
}
#record-mobile { margin: 0; }
</style>
<div id="app">
<aside aria-label="Meetings">
 <label class="search"><span class="search-icon" aria-hidden="true"><!-- search-icon --></span><input id="search" type="search" placeholder="Filter meetings" aria-label="Filter meetings"></label>
 <nav id="list" aria-label="Recorded meetings"></nav>
 <div class="recording-controls"><button id="record" class="record" title="Record or stop meeting (⌘⇧R)" aria-label="Record meeting" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5"/></svg><span>Record</span></button></div>
</aside>
<main>
 <div id="notice" class="notice" role="status"></div>
 <div id="empty"><h2>Record a meeting</h2><p>Record a meeting to capture its transcript. When it ends, turn the discussion into notes and action items.</p></div>
 <section id="document" aria-label="Meeting document">
  <header class="document-header">
   <button id="back" class="back">Meetings</button>
   <input id="title" placeholder="Untitled meeting" aria-label="Meeting title">
   <div id="metadata" class="metadata"></div>
   <div class="document-actions">
    <button id="record-mobile" class="back" title="Record or stop meeting (⌘⇧R)">Record</button>
    <button id="summarize">Summarize</button><button id="save">Save changes</button>
    <button id="mode-edit" hidden>Edit Markdown</button>
    <button id="delete-meeting" aria-label="Delete meeting"><span class="delete-icon" aria-hidden="true"><!-- delete-icon --></span><span>Delete</span></button>
    <button id="cancel-delete" hidden>Cancel</button><span id="analysis-state" role="status"></span>
   </div>
  </header>
  <div class="document-tabs" aria-label="Meeting view"><button id="show-summary" aria-pressed="false" disabled>Summary</button><button id="show-transcript" aria-pressed="true">Transcript</button></div>
  <div class="editor-area"><textarea id="editor" spellcheck="true" aria-label="Meeting transcript"></textarea><article id="preview" aria-label="Meeting summary"></article><div id="live" aria-label="Live transcript" aria-live="polite"><div id="finals"></div><div id="partials"></div></div></div>
 </section>
</main>
</div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id), call = (method, params = {}) => meetingsRequest(method, params);
  let confirmDelete = null, deleting = false;
  let rows = [], selected = null, doc = null, view = "transcript", editingSummary = false, dirty = false, dirtyFields = new Set(), editEpoch = 0, capture = null, connecting = true, visible = true, polling = false, analysis = false, loadEpoch = 0, listEpoch = 0, saving = null, recordBusy = false;
  const isActive = (state) => ["starting", "recording", "finishing"].includes(state?.phase), date = (ms) => new Date(ms).toLocaleString(void 0, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }), time = (ms) => {
    const s = Math.floor(ms / 1e3);
    return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((v) => String(v).padStart(2, "0")).join(":");
  };
  function notice(text, error = false) {
    $("notice").textContent = text || "";
    $("notice").className = "notice" + (error ? " error" : "");
    $("notice").style.display = text ? "block" : "none";
  }
  const rowNodes = new Map();
  const emptyList = document.createElement("div");
  emptyList.className = "list-empty";
  function visibleRows() {
    const query = $("search").value.trim().toLowerCase();
    return rows.filter(row => row.meeting && row.state && row.meeting.title.toLowerCase().includes(query));
  }
  function renderList() {
    const root = $("list"), displayed = visibleRows();
    const ids = new Set(displayed.map(row => row.meeting.id));
    for (const [id, button] of rowNodes) {
      if (ids.has(id)) continue;
      button.remove();
      rowNodes.delete(id);
    }
    let index = 0;
    for (const row of displayed) {
      const {id} = row.meeting;
      let button = rowNodes.get(id);
      if (!button) {
        button = document.createElement("button");
        const title = document.createElement("div"), detail = document.createElement("div");
        title.className = "list-title";
        detail.className = "list-date";
        button.append(title, detail);
        rowNodes.set(id, button);
      }
      button.setAttribute("aria-current", String(id === selected));
      button.children[0].textContent = row.meeting.title;
      button.children[1].textContent = (row.error ? "Saved data needs attention" : date(row.state.started_at)) + (isActive(row.state) ? " · Recording" : "");
      button.onclick = () => row.error ? showError(new Error(row.error)) : open(id).catch(showError);
      const next = root.children[index++] || null;
      if (next !== button) root.insertBefore(button, next);
    }
    if (index) emptyList.remove();
    else {
      emptyList.textContent = $("search").value.trim() ? "No matching meetings." : "Your recorded meetings will appear here.";
      if (root.children[0] !== emptyList) root.append(emptyList);
    }
  }
  async function refresh() {
    const epoch = ++listEpoch, result = await call("meetings.list");
    if (epoch !== listEpoch) return;
    rows = result;
    renderList();
  }
  function showError(error) {
    notice(error.message || String(error), true);
    $("analysis-state").textContent = "";
  }
  function setDirty(field) {
    dirty = true;
    dirtyFields.add(field);
    editEpoch++;
    $("save").style.display = "inline-block";
  }
  function renderDocument() {
    document.body.classList.toggle("has-document", !!selected);
    $("empty").style.display = selected ? "none" : "block";
    $("document").style.display = selected ? "flex" : "none";
    renderList();
    if (!selected) return;
    $("title").value = doc?.meeting?.title || "Untitled meeting";
    renderState();
    renderBody();
    renderLive();
  }
  function renderState() {
    const recording = !!capture && capture.id === selected;
    const state = recording ? capture.state : doc?.state, phase = capture?.state.phase;
    $("record").setAttribute("aria-pressed", String(!!capture));
    $("record").querySelector("span").textContent = capture ? phase === "finishing" ? "Finishing…" : "Stop" : "Record";
    $("record").disabled = phase === "finishing" || recordBusy || connecting || deleting;
    $("record-mobile").textContent = $("record").querySelector("span").textContent;
    $("record-mobile").disabled = $("record").disabled;
    $("record").setAttribute("aria-label", capture ? "Stop recording meeting" : "Record meeting");
    $("title").readOnly = recording || !!doc?.awaitingTranscript || deleting;
    $("editor").readOnly = recording || !!doc?.awaitingTranscript || deleting;
    $("delete-meeting").hidden = !doc?.meeting || recording || !!doc?.awaitingTranscript;
    $("delete-meeting").disabled = deleting || analysis || !!saving;
    $("delete-meeting").querySelector("span:last-child").textContent = deleting ? "Deleting…" : confirmDelete === selected ? "Delete meeting?" : "Delete";
    $("cancel-delete").hidden = !confirmDelete || confirmDelete !== selected;
    $("cancel-delete").disabled = deleting;
    $("save").disabled = deleting;
    $("show-summary").disabled = !doc?.meeting?.summary;
    $("summarize").disabled = recording || !!doc?.awaitingTranscript || analysis || deleting || !doc?.transcript?.trim();
    $("summarize").textContent = analysis ? "Summarizing…" : doc?.meeting?.summary ? "Summarize again" : "Summarize";
    $("mode-edit").hidden = view !== "summary";
    $("mode-edit").textContent = editingSummary ? "Preview" : "Edit Markdown";
    $("save").style.display = dirty ? "inline-block" : "none";
    if (state) {
      const ended = state.ended_at ?? (recording ? Date.now() : null);
      const duration = ended === null ? "Duration unknown" : time(Math.max(0, ended - state.started_at));
      $("metadata").textContent = (recording ? ({starting:"Preparing",recording:"Recording",finishing:"Finishing"}[phase] + " · ") : "") + date(state.started_at) + " · " + duration + " · Microphone + system audio";
      if (state.error) notice(state.error, true);
    }
    if (doc?.meeting?.summary && doc.meeting.summary.source_revision !== doc.meeting.transcript_revision) notice("The transcript has changed since this summary was generated. Summarize again to update it.");
  }
  function renderBody() {
    const live = (capture?.id === selected || !!doc?.awaitingTranscript) && view === "transcript";
    $("live").style.display = live ? "block" : "none";
    const preview = view === "summary" && !editingSummary;
    $("preview").style.display = !live && preview ? "block" : "none";
    $("editor").style.display = !live && !preview ? "block" : "none";
    $("editor").setAttribute("aria-label", view === "summary" ? "Summary Markdown" : "Meeting transcript");
    if (preview) $("preview").innerHTML = doc?.summary_html || "";
    else if (!live) $("editor").value = view === "summary" ? doc?.meeting?.summary?.text || "" : doc?.transcript || "";
    $("show-transcript").setAttribute("aria-pressed", String(view === "transcript"));
    $("show-summary").setAttribute("aria-pressed", String(view === "summary"));
  }
  async function save() {
    if (deleting) return;
    if (saving) { await saving; return; }
    if (!dirty || !doc) return;
    const id = selected, epoch = editEpoch, fields = new Set(dirtyFields), body = $("editor").value, params = { id, revision: doc.meeting.revision };
    if (fields.has("title")) params.title = $("title").value;
    if (fields.has("transcript")) params.transcript = body;
    if (fields.has("summary")) params.summary = body;
    saving = call("meetings.update", params);
    let result;
    try { result = await saving; } finally { saving = null; }
    if (selected !== id) return;
    const {summary_html, ...meeting} = result;
    doc.meeting = meeting;
    if (fields.has("summary")) doc.summary_html = summary_html;
    if (fields.has("transcript")) doc.transcript = body;
    if (epoch === editEpoch) {
      dirty = false;
      dirtyFields.clear();
      $("save").style.display = "none";
    }
    if (fields.has("title")) {
      listEpoch++;
      const row = rows.find((row) => row.meeting.id === id);
      if (row) row.meeting.title = meeting.title;
      renderList();
    }
  }
  function documentVersion() {
    return { id: selected, load: loadEpoch, edits: editEpoch };
  }
  function currentDocument(version) {
    return selected === version.id && loadEpoch === version.load && editEpoch === version.edits && !dirty;
  }
  async function open(id) {
    if (deleting) return;
    loadEpoch++;
    if (id === selected && doc && !doc.awaitingTranscript) return;
    const version = documentVersion();
    if (dirty) await save();
    if (!currentDocument(version)) return;
    let value = await call("meetings.read", { id });
    if (!currentDocument(version)) return;
    // An in-flight document snapshot can predate the terminal capture receipt.
    if (isActive(value.state) && capture?.id !== id) {
      value = await call("meetings.read", { id });
      if (!currentDocument(version)) return;
      if (isActive(value.state) && capture?.id !== id) throw new Error("Recording state changed. Select the meeting to reload it.");
    }
    confirmDelete = null;
    selected = id;
    doc = value;
    view = "transcript";
    editingSummary = false;
    notice("");
    renderDocument();
  }

  async function deleteMeeting() {
    if (!doc?.meeting || capture?.id === selected || doc.awaitingTranscript || deleting || saving || analysis) return;
    if (confirmDelete !== selected) {
      confirmDelete = selected;
      renderState();
      return;
    }
    const { id, revision } = doc.meeting;
    const position = visibleRows().findIndex(row => row.meeting.id === id);
    deleting = true;
    loadEpoch++;
    renderState();
    try {
      await call("meetings.delete", { id, revision });
      listEpoch++;
      rows = rows.filter(row => row.meeting.id !== id);
      selected = null;
      doc = null;
      dirty = false;
      dirtyFields.clear();
      notice("");
    } finally {
      deleting = false;
      confirmDelete = null;
      renderState();
    }
    renderDocument();
    const visible = visibleRows();
    const next = visible[Math.min(Math.max(0, position), visible.length - 1)];
    if (next && !next.error) await open(next.meeting.id);
  }

  // The capture model owns the cursor and bounded transcript independently of
  // selection, view changes and the document's editable revision.
  function adoptCapture(state, recover = false) {
    capture = { id: state.id, state, recover, sequence: 0, segments: [], partials: {} };
    renderState();
  }
  function renderLive() {
    if (view !== "transcript" || capture?.id !== selected) return;
    const root = $("finals"), live = $("live");
    const follow = live.scrollHeight - live.scrollTop - live.clientHeight < 180;
    if (root.captureId !== capture.id) {
      root.replaceChildren();
      root.captureId = capture.id;
    }
    const first = capture.segments[0]?.sequence ?? Infinity;
    while (root.firstElementChild?.segmentSequence < first) root.firstElementChild.remove();
    const rendered = root.lastElementChild?.segmentSequence ?? 0;
    for (const segment of capture.segments) {
      if (segment.sequence <= rendered) continue;
      const line = document.createElement("p"), label = document.createElement("span");
      line.segmentSequence = segment.sequence;
      label.className = "live-label";
      label.textContent = time(segment.start_ms) + " · " + (segment.source === "microphone" ? "Microphone" : "System audio");
      line.append(label, document.createTextNode(segment.text.trim()));
      root.append(line);
    }
    $("partials").textContent = Object.entries(capture.partials).map(([source, text]) => (source === "microphone" ? "Microphone: " : "System audio: ") + text).join("\n");
    if (follow) live.scrollTop = live.scrollHeight;
  }
  async function toggleRecord() {
    if (connecting || recordBusy || deleting || capture?.state.phase === "finishing") return;

        const current = capture;

          await call("audio.stop", { id: current.id });

          if (capture === current) throw error;

        }

        return;

      if (dirty) await save();
      if (dirty || capture) return;
      const version = documentVersion();
      let result;
      try {
        result = await call("meetings.start");

        const current = await call("audio.current");
        if (current) adoptCapture(current, true);
        throw error;
      }
      adoptCapture(result.state);
      if (!currentDocument(version)) return;
      loadEpoch++;
      confirmDelete = null;
      selected = result.id;
      doc = null;
      view = "transcript";
      editingSummary = false;
      notice("");
      renderDocument();
    } finally { recordBusy = false; renderState(); }
  }
  async function hydrateTranscript(id, placeholder) {
    try {
      const full = await call("meetings.read", { id });
      if (selected !== id || doc !== placeholder || !placeholder.awaitingTranscript) return;
      doc = full;
      renderDocument();
    } catch {
      if (selected === id && doc === placeholder) {
        notice(placeholder.state.error || "Could not load the saved transcript. Select the meeting to try again.", true);
      }
    }
  }
  async function recoverLive(current) {
    current.recovering = true;
    try {
      const full = await call("meetings.read", { id: current.id });
      if (capture !== current) return;
      current.segments = full.segments.slice(-400);
      current.sequence = full.sequence;
      current.recover = false;
      renderLive();
    } catch (error) {
      if (capture === current) showError(error);
    } finally {
      current.recovering = false;
    }
  }
  async function poll() {
    if (polling || !visible || !capture) return;
    polling = true;
    try {
      const current = capture, {id} = current;
      const result = await call("audio.status", { id, after: current.sequence });
      if (capture !== current || !result.state) return;
      if (!isActive(result.state)) {
        capture = null;
        if (selected === id) {
          doc = { ...doc, state: result.state, awaitingTranscript: true };
          void hydrateTranscript(id, doc);
        }
        renderState();
        if (result.state.error) notice(result.state.error, true);
        await refresh();
        return;
      }
      const phases = ["starting", "recording", "finishing"];
      if (phases.indexOf(result.state.phase) >= phases.indexOf(current.state.phase)) current.state = result.state;
      if (result.reload) current.recover = true;
      if (current.recover && current.state.phase !== "starting") {
        if (!current.recovering) void recoverLive(current);
      } else {
        const delta = (result.segments || []).filter((segment) => segment.sequence > current.sequence);
        if (delta.length) {
          current.segments = current.segments.concat(delta).slice(-400);
          current.sequence = delta[delta.length - 1].sequence;
        }
      }
      current.partials = result.partials || {};
      renderState();
      renderLive();
      if (current.state.phase !== "starting" && !rows.some(row => row.meeting.id === id)) await refresh();
    } catch (error) {
      showError(error);
    } finally {
      polling = false;
    }
  }
  async function summarize() {
    if (!doc || analysis || deleting) return;
    const version = documentVersion();
    await save();
    if (!currentDocument(version)) return;
    analysis = true;
    const id = selected, epoch = ++loadEpoch;
    renderState();
    $("analysis-state").textContent = "Analyzing transcript";
    try {
      const result = await call("meetings.summarize", { id });
      // Reconcile only forward. A reopened document may have saved edits
      // after the summary committed but before its response arrived.
      if (selected === id && doc?.meeting.id === id && result.meeting.revision > doc.meeting.revision) {
        doc = result;
        if (dirty) {
          notice("Summary ready. Your unsaved edits are still here.");
        } else {
          if (loadEpoch === epoch) {
            editingSummary = false;
            view = "summary";
            notice("");
          }
          renderDocument();
        }
      }
    } catch (error) {
      showError(error);
    } finally {
      analysis = false;
      $("analysis-state").textContent = "";
      renderState();
    }
  }
  $("record").onclick = $("record-mobile").onclick = () => toggleRecord().catch(showError);
  $("search").oninput = renderList;
  $("list").oncontextmenu = event => event.preventDefault();
  $("delete-meeting").onclick = () => deleteMeeting().catch(showError);
  $("cancel-delete").onclick = () => {
    confirmDelete = null;
    renderState();
  };
  $("title").oninput = () => setDirty("title");
  $("editor").oninput = () => setDirty(view === "summary" ? "summary" : "transcript");
  $("save").onclick = () => save().catch(showError);
  $("summarize").onclick = () => summarize().catch(showError);
  async function changeDocument(change) {
    if (deleting) return;
    loadEpoch++;
    const version = documentVersion();
    await save();
    if (!currentDocument(version)) return;
    confirmDelete = null;
    change();
    renderDocument();
  }
  $("show-transcript").onclick = () => changeDocument(() => { view = "transcript"; }).catch(showError);
  $("show-summary").onclick = () => changeDocument(() => {
    view = "summary";
    editingSummary = false;
  }).catch(showError);
  // A successful save already returns the HTML for its saved revision.
  $("mode-edit").onclick = () => changeDocument(() => { editingSummary = !editingSummary; }).catch(showError);
  $("back").onclick = () => changeDocument(() => {
    selected = null;
    doc = null;
  }).catch(showError);
  addEventListener("vorkspace-visibility", (event) => {
    visible = event.detail;
    if (visible) poll();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && confirmDelete && !deleting) {
      confirmDelete = null;
      renderState();
    }
    if (event.metaKey && event.key.toLowerCase() === "s") {
      event.preventDefault();
      save().catch(showError);
    }
    if (event.metaKey && event.shiftKey && event.key.toLowerCase() === "r") {
      event.preventDefault();
      toggleRecord().catch(showError);
    }
  });
  setInterval(poll, 1e3);
  setInterval(() => {
    if (capture && visible) renderState();
  }, 1e3);
  const initialDocument = documentVersion();
  renderState();
  call("audio.current").then((state) => {
    if (!state) return;
    adoptCapture(state, true);
    if (currentDocument(initialDocument)) open(state.id).catch(showError);
    void poll();
  }).catch(showError).finally(() => {
    connecting = false;
    renderState();
  });
  refresh().catch(showError);
})();
</script>
