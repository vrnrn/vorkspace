[package]
name = "vorkspace-gpui"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
tempfile = "3"
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
vorkspace-core = { path = "../vorkspace-core" }
vorkspace-runtime = { path = "../vorkspace-runtime" }
vorkspace-editor = { path = "../vorkspace-editor" }
vorkspace-macos = { path = "../vorkspace-macos" }
vorkspace-model = { path = "../vorkspace-model" }
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# The bounded foreground journal and native hang-monitor worker.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["profiler"] }
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
base64 = "0.22"
# The terminal dock: PTY, VT parser and grid (as Zed's terminal uses).
alacritty_terminal = "0.26"
libc = "0.2"
rquickjs = "0.14.0"
similar = "2.7"
# The vendored renderer's backdrop-blur marker for frosted popovers.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }
# Pins the native traffic lights to the Tauri app's spacing.
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSApplication", "NSDockTile", "NSButton", "NSControl", "NSLayoutAnchor", "NSLayoutConstraint", "NSResponder", "NSView", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSBezierPath", "NSColor", "NSFont", "NSFontDescriptor", "NSImageView", "NSTextField", "NSPasteboard", "NSScreen", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
png = "0.18"
raw-window-handle = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSGeometry", "NSData", "NSRange", "NSArray", "NSSet", "NSError", "NSBundle", "NSURL", "NSURLRequest"] }
objc2-user-notifications = "0.3"

[dev-dependencies]
vorkspace-runtime = { path = "../vorkspace-runtime", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }
rusqlite.workspace = true
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["test-support", "runtime_shaders"] }
parking_lot = "0.12"
